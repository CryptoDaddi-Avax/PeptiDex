server {
    listen 80;
    server_name peptidex.app www.peptidex.app 76.13.26.209;
    return 301 https://peptidex.app$request_uri;
}

server {
    listen 443 ssl;
    server_name peptidex.app www.peptidex.app;

    ssl_certificate /etc/letsencrypt/live/peptidex.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/peptidex.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Redirect www to non-www
    if ($host = www.peptidex.app) {
        return 301 https://peptidex.app$request_uri;
    }

    root /var/www/peptidex;
    index index.html;

    # ─── SECURITY HEADERS ───────────────────────────────────────────────
    # Hide Nginx version
    server_tokens off;

    # HSTS — force HTTPS for 1 year + subdomains + preload eligible
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # XSS Protection (legacy browsers)
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com; frame-ancestors 'self';" always;

    # Permissions Policy — restrict browser features
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;

    # ─── COMPRESSION ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ─── CACHE CONTROL ──────────────────────────────────────────────────
    # Cache static assets aggressively
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache images
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # ─── ROUTING ────────────────────────────────────────────────────────
    # SPA routing — serve index.html for all routes (Next.js static export)
    location / {
        try_files $uri.html $uri $uri/ /index.html;
    }

    # Block access to hidden files
    location ~ /\. {
        deny all;
        return 404;
    }
}
