server {
    listen 80;
    server_name peptidex.app www.peptidex.app;
    return 301 https://peptidex.app$request_uri;
}

server {
    listen 443 ssl http2;
    server_name peptidex.app www.peptidex.app;

    ssl_certificate /etc/letsencrypt/live/peptidex.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/peptidex.app/privkey.pem;

    # ── GZIP COMPRESSION ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff2;

    # ── STATIC ASSET CACHING (1 year, immutable) ──
    location /_next/static/ {
        proxy_pass http://localhost:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── OPTIMIZED IMAGES CACHE (30 days) ──
    location /_next/image/ {
        proxy_pass http://localhost:3000;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        access_log off;
    }

    # ── STATIC FILES CACHE (30 days) ──
    location ~* \.(png|jpg|jpeg|gif|svg|webp|avif|ico|woff|woff2|ttf|css|js)$ {
        proxy_pass http://localhost:3000;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        access_log off;
    }

    # ── MAIN PROXY ──
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── BLOCK DOTFILES ──
    location ~ /\. {
        deny all;
        return 404;
    }
}
